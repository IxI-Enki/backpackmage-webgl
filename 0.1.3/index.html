<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | BackpackMage</title>
    <link rel="shortcut icon" href="BackpackMage-Logo.png">
    <style>
        body {
            background-color: #020409;
            color: white;
            font-size: 33px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #unity-container {
            background-color: #0e1116;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: calc(100vh - 50px);
            max-width: 100vw;
        }

        #unity-canvas {
            background-color: #161b22;
            border: 1px solid #3e444c;
            width: 80%;
            height: 80%;
        }

        #unity-loading-bar {
            position: absolute;
            background-color: #0e1116;
            color: #9298a0;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #unity-logo {
            background-image: url('BackpackMage-Logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            width: 150px;
            height: 150px;
            display: block;
        }

        .lazyload {
            background-image: none !important;
        }

        #unity-progress-bar-empty {
            background-color: #3e444c;
            border-radius: 5px;
            margin: 10px 0;
            width: 100%;
            height: 20px;
        }

        #unity-progress-bar-full {
            background-color: #9298a0;
            border-radius: 5px;
            height: 100%;
            width: 0%;
        }

        #unity-warning {
            background-color: #161b22;
            color: #9298a0;
            padding: 10px;
            border-radius: 5px;
            margin: 10px;
            display: none;
        }

        #github-link-container {
            background-color: #0e1116;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        #github-profile-img {
            width: 2em;
            height: 2em;
            border-radius: 50%;
            margin-left: 11px;
        }

        #github-link {
            color: #9298a0;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        #github-link:hover {
            color: white;
        }

        #unity-fullscreen-button {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #161b22;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            font-size: 20px;
        }

        #farewell-message {
            font-size: 33px;
            background-color: #0e1116;
            color: #9298a0;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            display: none;
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
        <button id="unity-fullscreen-button" title="Resize Screen">⛶</button>
    </div>

    <div id="github-link-container">
        <a id="github-link" href="https://github.com/IxI-Enki" title="Back to IxI's Github Profile" target="_blank">
            IxI-Enki on github
            <img id="github-profile-img" title="Back to IxI's Github Profile"
                 src="https://avatars.githubusercontent.com/u/138018029?v=4" alt="GitHub Profile">
        </a>
    </div>

    <div id="farewell-message">
        Thank you for using BackpackMage. The application has been closed.
    </div>

    <script>
        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/0.1.3.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/0.1.3.data",
            frameworkUrl: buildUrl + "/0.1.3.framework.js",
            codeUrl: buildUrl + "/0.1.3.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "NotYetAStudio",
            productName: "BackpackMage",
            productVersion: "0.1.0",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                    unityInstance.SetFullscreen(1);
                };

                // Override console.log to detect application exit
                var originalConsoleLog = console.log;
                console.log = function(message) {
                    originalConsoleLog.apply(console, arguments);
                    if (message.includes("Quitting...")) {
                        document.querySelector("#unity-container").style.display = "none";
                        document.querySelector("#farewell-message").style.display = "block";
                    }
                };

            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
